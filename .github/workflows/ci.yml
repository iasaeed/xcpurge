name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Test without running swift for manifests
        run: XCPURGE_NO_SWIFT=1 swift test
      - name: Scan the ModularWorkspace fixture
        run: swift run xcpurge scan Tests/Fixtures/ModularWorkspace --format github
