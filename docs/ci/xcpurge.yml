# Sample workflow: unused-resource findings as pull-request annotations with `xcpurge scan`.
# Copy to .github/workflows/xcpurge.yml in YOUR repository (it lives under docs/ here so it never runs on xcpurge's own
# repository). No xcodebuild: xcpurge reads the files in the checkout, so this runs in well under a minute.
#
# - A release binary is downloaded rather than brewed: Homebrew installs are slow and unreliable on hosted runners and
#   Xcode Cloud (cf. Periphery #1055), and a pinned version keeps findings stable across runs.
# - `--baseline .xcpurge-baseline.json` hides what the team has accepted (`xcpurge baseline` writes the file) so
#   `--fail-on any` only fails on NEW findings. Drop both flags to annotate without gating.
# - The default shallow checkout (`fetch-depth: 1`) is all a scan needs. `--git` (age and author per finding) needs
#   the history: switch to the commented `fetch-depth: 0` variant and add `--git` to the scan; shallow clones get "n/a".
name: xcpurge

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  XCPURGE_VERSION: "0.4.0"

jobs:
  scan:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # With --git (age and author per finding), check out the history instead:
      # - uses: actions/checkout@v4
      #   with:
      #     fetch-depth: 0

      - name: Install xcpurge
        # Pinned release binary: the `xcpurge-macos.tar.gz` asset of the tagged release (built with
        # `make package` / Scripts/package-release.sh, a universal arm64 + x86_64 binary at the archive root),
        # verified against its `.sha256` before extraction.
        # `brew install iasaeed/tap/xcpurge` works too but is slower and floats to the newest version.
        run: |
          base="https://github.com/iasaeed/xcpurge/releases/download/v${XCPURGE_VERSION}"
          curl -fsSL "$base/xcpurge-macos.tar.gz" -o xcpurge-macos.tar.gz
          curl -fsSL "$base/xcpurge-macos.tar.gz.sha256" -o xcpurge-macos.tar.gz.sha256
          shasum -a 256 -c xcpurge-macos.tar.gz.sha256   # the archive is extracted only when the checksum matches
          mkdir -p "$HOME/.local/bin" && tar -xzf xcpurge-macos.tar.gz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/xcpurge" --version

      - name: Scan
        run: xcpurge scan . --format github --min-confidence medium --baseline .xcpurge-baseline.json --fail-on any
        # with fetch-depth 0 above:  xcpurge scan . --git --format github --min-confidence medium --baseline .xcpurge-baseline.json --fail-on any
