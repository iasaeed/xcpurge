# Sample workflow: app-size comment and gate on pull requests with `xcpurge size`.
# Copy to .github/workflows/xcpurge-size.yml in YOUR repository (it lives under docs/ here so xcpurge's own CI never
# posts comments). Nothing is built or uploaded anywhere: xcpurge measures the files in the checkout.
#
# How it works
#   push to main      -> `xcpurge size . --save size-base.json`, kept as the `xcpurge-size-base` artifact.
#   pull_request      -> downloads the latest main artifact, compares, writes size.md when the change is at least
#                        --comment-threshold, and posts/edits ONE sticky comment (deleted again when size.md is absent).
#                        `--fail-if-grows 500KB` fails the job on growth above that, unless the PR carries the
#                        `size-increase-ok` label (the escape hatch). Adding or removing the label re-runs the job
#                        (`labeled` / `unlabeled` below), so no manual re-run is needed.
#   The comment is posted (or the stale one removed) before the gate's failure is reported: those steps run with
#   `always()`, so a failing gate still leaves the numbers on the PR.
#
# Pull requests from forks run with a read-only GITHUB_TOKEN: the comparison and the gate still work, but the comment
# steps cannot write to the PR, so they carry `continue-on-error: true` and the job passes or fails on the gate alone.
#
# No artifact? Compare against a worktree of the base branch instead (slower, no artifact plumbing):
#   - run: git fetch origin "$BASE" && git worktree add ../base "origin/$BASE"
#   - run: xcpurge size ../base --save size-base.json
#   (then the same `xcpurge size . --compare size-base.json ...` step below)
#
# The comment says what it measured: source-tree bytes, not shipped bytes. To compare install size, build the app on
# both sides and pass `--app Build/Products/Release-iphoneos/MyApp.app` (or an .ipa, which also reports the compressed
# .ipa size as the download size) to both `size` runs.
name: xcpurge size

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` / `unlabeled`: toggling `size-increase-ok` re-evaluates the gate without a new push.
    types: [opened, synchronize, reopened, labeled, unlabeled]

# `pull-requests: write` lets the comment steps post; a fork PR gets a read-only token regardless (see above).
permissions:
  contents: read
  pull-requests: write
  actions: read

env:
  XCPURGE_VERSION: "0.5.0"

jobs:
  size:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcpurge
        # Pinned release binary: the `xcpurge-macos.tar.gz` asset of the tagged release (built with
        # `make package` / Scripts/package-release.sh, a universal arm64 + x86_64 binary at the archive root),
        # verified against its `.sha256` before extraction.
        # `brew install iasaeed/tap/xcpurge` works too but is slower and floats to the newest version.
        run: |
          base="https://github.com/iasaeed/xcpurge/releases/download/v${XCPURGE_VERSION}"
          curl -fsSL "$base/xcpurge-macos.tar.gz" -o xcpurge-macos.tar.gz
          curl -fsSL "$base/xcpurge-macos.tar.gz.sha256" -o xcpurge-macos.tar.gz.sha256
          shasum -a 256 -c xcpurge-macos.tar.gz.sha256   # the archive is extracted only when the checksum matches
          mkdir -p "$HOME/.local/bin" && tar -xzf xcpurge-macos.tar.gz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/xcpurge" --version

      # ---- main: record the base snapshot ----
      - name: Measure base
        if: github.event_name == 'push'
        run: xcpurge size . --save size-base.json --quiet

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: xcpurge-size-base
          path: size-base.json
          retention-days: 90

      # ---- pull requests: compare, comment, gate ----
      - name: Find the latest base snapshot
        if: github.event_name == 'pull_request'
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.base_ref }}
        run: |
          # `-e push`: only runs of the push job write the artifact; a fork PR from a branch also named `main` does not.
          run_id=$(gh run list -b "$BASE" -w xcpurge-size.yml -e push -s success -L1 --json databaseId -q '.[0].databaseId' || true)
          echo "run-id=${run_id}" >> "$GITHUB_OUTPUT"
          [ -n "$run_id" ] || echo "::notice::no successful xcpurge-size run on $BASE yet; the first comparison needs one push to $BASE"

      - uses: actions/download-artifact@v4
        if: github.event_name == 'pull_request' && steps.base.outputs.run-id != ''
        continue-on-error: true
        with:
          name: xcpurge-size-base
          run-id: ${{ steps.base.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Compare
        if: github.event_name == 'pull_request'
        env:
          # Add the `size-increase-ok` label to a PR whose growth is intended: the gate is skipped, the comment stays.
          # (`!contains(...) && flag || ''`: the flag is the truthy operand, so the label really yields an empty GATE.)
          GATE: ${{ !contains(github.event.pull_request.labels.*.name, 'size-increase-ok') && '--fail-if-grows 500KB' || '' }}
        run: |
          # shellcheck disable=SC2086
          xcpurge size . --compare size-base.json --format markdown \
            --comment-threshold 100KB --allow-missing-compare --output size.md $GATE

      # `always()`: the comment is written even when the gate above failed the job. `continue-on-error`: a fork PR's
      # read-only token cannot comment; that must not hide the gate's result.
      - name: Comment
        if: always() && github.event_name == 'pull_request' && hashFiles('size.md') != ''
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: xcpurge-size
          path: size.md

      - name: Remove stale comment
        if: always() && github.event_name == 'pull_request' && hashFiles('size.md') == ''
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: xcpurge-size
          delete: true
